{% extends "base.html" %}

{% block title %}新規投稿 - Find it{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin_posts.css' )}}">
{% endblock %}

{% block content %}
<header class="detail-header">
        <a href="{{ url_for('show_posts') }}" class="back-button">
             <img src="{{ url_for('static', filename='images/arrow-left.svg') }}"
                  class="arrow-left" 
                  alt="戻る">
        </a>
</header>

<main class="admin-posts">
    <h2 class="admin-posts-title">
        新規投稿
    </h2>

   <form class="posts-form" method="post" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token()}}">
        <!-- =====フォームフィールド===== -->
        <div>
            <label>カテゴリ</label>
            <select name="category" required>

                <option value="">
                    選択してください
                </option>

                {% for category in categories %}
                    <option value="{{ category }}">
                        {{ category }}
                    </option>
                {% endfor %}

            </select>

        </div>

        <div>
            <label>詳細説明</label>
            <input type="text" placeholder="特徴などを記載" name="description">
        </div>

        <div>
            <label for="found_date">日付</label>
            <input type="date" id="found_date" name="found_date">
        </div>

        <div>
            <label>場所</label>
            <input type="text" placeholder="発見場所を記載" name="found_place">
        </div>
    
        <div class="upload-photo">
            <div>写真をアップロード</div>
            <label for="photo" class="upload-button">
                <img 
                src="{{ url_for('static', filename='images/upload_icon.svg')}}"
                alt="アップロード"
                class="upload-icon"
                >
            </label>
            <input
                type="file"
                id="photo"
                name="image"
                accept="image/*"
                hidden
            >
             <!-- 削除ボタン -->
            <button type="button" 
                    id="remove-photo-button"
                    hidden
            >
                削除
            </button>

        </div>

        <div class="register-button">
            <button class="admin-posts-button" type="submit">登録</button>
        </div>

    </form>

</main>

<script>
    const photoInput = document.getElementById("photo");
    const removeButton = document.getElementById("remove-photo-button");

    photoInput.addEventListener("change", function(){
        console.log("画像選択");
        //削除ボタン表示
        removeButton.hidden = false;
    });
    
    //削除ボタンを押した時
    removeButton.addEventListener("click", function(){

        photoInput.value = "";
        //削除ボタンを非表示
        removeButton.hidden =true;

        console.log("画像削除");

    });
</script>

{% endblock %}

{% extends "base.html" %}

{% block title %}新規投稿 - Find it{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin_posts.css' )}}">
{% endblock %}

{% block content %}
<div class="admin_posts">
    <header class="post-header">
        <a href="{{ url_for('show_posts') }}" class="back-button">
            <img src="{{ url_for('static', filename='images/arrow-left.svg') }}" class="arrow-left" alt="戻る">
        </a>
        <h2 class="admin-posts-title">新規投稿</h2>
    </header>

    <main class="main-admin-posts">


        <form class="posts-form" action="{{ url_for('create_post') }}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token()}}">
            <div>
                <label>カテゴリグループ</label>
                <select id="groupSelect" name="group_id" class="form-select" required>
                    <option value="">グループを選択してください</option>
                    {% for group in groups %}
                    <option value="{{ group.id }}">{{ group.name }}</option>
                    {% endfor %}
                </select>

                <label>カテゴリ</label>
                <select id="categorySelect" name="category_id" class="form-select" disabled>
                    <option value="">先にグループを選択してください</option>
                </select>
            </div>

            <div>
                <label>詳細説明</label>
                <textarea placeholder="特徴などを記載" name="description"></textarea>
            </div>

            <div>
                <label for="found_date">日付</label>
                <input type="date" id="found_date" name="found_date">
            </div>

            <div>
                <label>場所</label>
                <input type="text" placeholder="発見場所を記載" name="found_place">
            </div>

            <div class="photo-area">
                <div class="upload-photo">写真をアップロード</div>
                <label for="photo" class="upload-button">
                    <img src="{{ url_for('static', filename='images/upload-icon.svg')}}" alt="アップロード"
                        class="upload-icon">
                </label>
                <input type="file" id="photo" name="image" accept="image/*" hidden multiple>

                <div id="preview-area" hidden>
                    <div id="preview-container"></div>
                    <button type="button" id="remove-photo-button">
                        <img class="close-icon" src="{{url_for('static', filename='images/close_round.svg')}}" alt="削除">
                    </button>
                </div>
            </div>

            <div class="register-button">
                <button class="admin-posts-button" type="submit">登録</button>
            </div>
        </form>
</div>
</main>

<script>
    const categoriesData = {{ categories_mapping | tojson | safe }};
    const groupSelect = document.getElementById('groupSelect');
    const categorySelect = document.getElementById('categorySelect');

    groupSelect.addEventListener('change', function () {
        const selectedGroupId = this.value;
        categorySelect.innerHTML = '<option value="">カテゴリを選択してください</option>';

        if (selectedGroupId !== "") {
            const matchingCategories = categoriesData[selectedGroupId];
            if (matchingCategories) {
                matchingCategories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.id;
                    option.textContent = category.name;
                    categorySelect.appendChild(option);
                });
            }
            categorySelect.disabled = false;
        } else {
            categorySelect.innerHTML = '<option value="">先にグループを選択してください</option>';
            categorySelect.disabled = true;
        }
    });

    const photoInput = document.getElementById("photo");
    const removeButton = document.getElementById("remove-photo-button");
    const previewArea = document.getElementById("preview-area");
    const previewContainer = document.getElementById("preview-container");

    let accumulatedFiles = [];

    photoInput.addEventListener("change", function () {
        const files = Array.from(this.files);
        if (files.length === 0) return;

        files.forEach(file => {
            accumulatedFiles.push(file);
            const reader = new FileReader();
            reader.onload = function (e) {
                const img = document.createElement("img");
                img.src = e.target.result;
                img.classList.add("preview-image");
                previewContainer.appendChild(img);
            };
            reader.readAsDataURL(file);
        });

        previewArea.hidden = false;
        photoInput.value = "";
    });

    removeButton.addEventListener("click", function () {
        accumulatedFiles = [];
        previewContainer.innerHTML = "";
        previewArea.hidden = true;
    });

    document.querySelector('.posts-form').addEventListener('submit', async function (e) {
        e.preventDefault();

        const formData = new FormData(this);
        formData.delete('image');
        accumulatedFiles.forEach(file => {
            formData.append('image', file);
        });

        const response = await fetch(this.action, {
            method: 'POST',
            body: formData
        });

        if (response.redirected) {
            window.location.href = response.url;
        }
    });
</script>
{% endblock %}

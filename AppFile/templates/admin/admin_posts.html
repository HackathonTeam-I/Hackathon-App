{% extends "base.html" %}

{% block title %}新規投稿 - Find it{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin_posts.css' )}}">
{% endblock %}

{% block content %}
<!--戻るボタン-->
<header class="detail-header">
        <a href="{{ url_for('show_posts') }}" class="back-button">
             <img src="{{ url_for('static', filename='images/arrow-left.svg') }}"
                  class="arrow-left" 
                  alt="戻る">
        </a>
</header>

<main class="admin-posts">
    <h2 class="admin-posts-title">
        新規投稿
    </h2>

   <form class="posts-form" method="post" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token()}}">
        <!-- =====フォームフィールド===== -->
        <div>
            <label>カテゴリグループ</label>

            <select id="groupSelect" name="group_id" class="form-select" required>
            <option value="">グループを選択してください</option>

            {% for group in groups %}
            <option value="{{ group.id }}">{{ group.name }}</option>
            {% endfor %}
            </select>


            <label>カテゴリ</label>

            <select id="categorySelect" name="category_id" class="form-select" disabled>
            <option value="">先にグループを選択してください</option>
            </select>
        </div>

        <div>
            <label>詳細説明</label>
            <textarea
                placeholder="特徴などを記載"
                name="description">
            </textarea>
        </div>

        <div>
            <label for="found_date">日付</label>
            <input type="date" id="found_date" name="found_date">
        </div>

        <div>
            <label>場所</label>
            <input type="text" placeholder="発見場所を記載" name="found_place">
        </div>
    
        <div class="photo-area">
            <div class="upload-photo">写真をアップロード</div>
            <label for="photo" class="upload-button">
                <img 
                src="{{ url_for('static', filename='images/upload_icon.svg')}}"
                alt="アップロード"
                class="upload-icon"
                >
            </label>
            <input
                type="file"
                id="photo"
                name="image"
                accept="image/*"
                hidden
            >
             <!-- 写真削除ボタン -->
            <button type="button" 
                    id="remove-photo-button"
                    hidden
            >
                <img class="close-icon" src="{{url_for('static', filename='images/close_round.svg')}}" alt="削除"> 
            </button>

        </div>

        <!--登録ボタン-->
        <div class="register-button">
            <button class="admin-posts-button" type="submit">登録</button>
        </div>

    </form>

</main>

{% endblock %}

{% block page_js %}
<script src="{{ url_for('static', filename='js/admin_posts.js') }}"></script>
{% endblock %}

{% extends "base.html" %}

{% block title %}投稿編集 - Find it{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin_posts.css' )}}">
{% endblock %}

{% block content %}
<header class="detail-header">
    <a href="{{ url_for('show_posts') }}" class="back-button">
        <img src="{{ url_for('static', filename='images/arrow-left.svg') }}" class="arrow-left" alt="戻る">
    </a>
</header>

<main class="admin-posts">
    <h2 class="admin-posts-title">
        投稿編集
    </h2>

    <form id="update-form" class="posts-form" enctype="multipart/form-data">
        <input type="hidden" id="csrf_token" name="csrf_token" value="{{ csrf_token()}}">
        <div>
            <label>カテゴリグループ</label>

            <select id="groupSelect" name="group_id" class="form-select" required>
                <option value="">グループを選択してください</option>
                {% for group in groups %}
                <option value="{{ group.id }}" {% if group.id==post.group_id %}selected{% endif %}>
                    {{ group.name }}
                </option>
                {% endfor %}
            </select>

            <label>カテゴリ</label>

            <select id="categorySelect" name="category_id" class="form-select" disabled>
                <option value="">先にグループを選択してください</option>
            </select>
        </div>

        <div>
            <label>詳細説明</label>
            <textarea placeholder="特徴などを記載" name="description">{{ post.description }}</textarea>
        </div>

        <div>
            <label for="found_date">日付</label>
            <input type="date" id="found_date" name="found_date" value="{{ post.found_date.strftime('%Y-%m-%d') }}">
        </div>

        <div>
            <label>場所</label>
            <input type="text" placeholder="発見場所を記載" name="found_place" value="{{ post.found_place }}">
        </div>

        <div class="photo-area">
            <div class="upload-photo">写真をアップロード</div>
            <label for="photo" class="upload-button">
                <img src="{{ url_for('static', filename='images/upload-icon.svg')}}" alt="アップロード" class="upload-icon">
            </label>
            <input type="file" id="photo" name="image" accept="image/*" hidden>

            {% if images %}
            {% set image = images[0] %}
            <div class="current-image">
                <img src="{{ url_for('static', filename=image.image_path.replace('static/','')) }}" alt="投稿画像"class="preview-image"> 

                <button type="button" id="remove-photo-button" data-post-id="{{ post.id }}"
                    data-image-id="{{ image.id }}">
                    <img class="close-icon" src="{{url_for('static', filename='images/close_round.svg')}}" alt="削除">
                </button>
            </div>
            {% endif %}
        </div>

        <div class="register-button">
            <button class="admin-posts-button" type="submit">更新</button>
        </div>
    </form>
</main>
{% endblock %}

{% block page_js %}
<script>
    const categoriesData = {{ categories_mapping | tojson | safe }};
    const groupSelect = document.getElementById('groupSelect');
    const categorySelect = document.getElementById('categorySelect');
    const csrfToken = document.getElementById("csrf_token").value;
    const postId = "{{ post.id }}";

    // 1. カテゴリの連動プルダウン
    groupSelect.addEventListener('change', function () {
        const selectedGroupId = this.value;
        categorySelect.innerHTML = '<option value="">カテゴリを選択してください</option>';

        if (selectedGroupId !== "") {
            const matchingCategories = categoriesData[selectedGroupId];
            if (matchingCategories) {
                matchingCategories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.id;
                    option.textContent = category.name;
                    categorySelect.appendChild(option);
                });
            }
            categorySelect.disabled = false;
        } else {
            categorySelect.innerHTML = '<option value="">先にグループを選択してください</option>';
            categorySelect.disabled = true;
        }
    });

    // 初期値セット
    groupSelect.value = "{{ post.group_id }}";
    groupSelect.dispatchEvent(new Event('change'));
    categorySelect.value = "{{ post.category_id }}";

    // 2. 画像の「状態管理」変数の定義
    let isImageDeletedPending = false; // 既存画像を削除する予定かどうかのフラグ
    let newImageFilePending = null;    // 新しくアップロードする画像ファイルオブジェクト
    let originalImageId = null;        // 既存画像のIDを保持する変数

    // 既存画像がある場合、HTMLのデータ属性から画像IDを取得しておく
    const removeButton = document.getElementById("remove-photo-button");
    if (removeButton) {
        originalImageId = removeButton.dataset.imageId;
    }

    // 3. 写真選択時のプレビュー処理（保留処理）
    const photoInput = document.getElementById("photo");
    const photoArea = document.querySelector(".photo-area");

    photoInput.addEventListener("change", function (e) {
        const file = e.target.files[0];
        if (file) {
            newImageFilePending = file; // ファイルをメモリ上に保留
            const previewUrl = URL.createObjectURL(file);

            let currentImageDiv = document.querySelector(".current-image");
            if (currentImageDiv) {
                // 既存の表示領域がある場合は、画像を差し替えて表示を確実に出す
                currentImageDiv.style.display = "block";
                currentImageDiv.querySelector(".preview-image").src = previewUrl;
            } else {
                // 最初から画像がない投稿だった場合は、新しくプレビュー枠を作成
                const div = document.createElement("div");
                div.className = "current-image";
                div.innerHTML = `
                <img src="${previewUrl}" alt="プレビュー画像" class="preview-image">
                <p style="text-align:center; font-size:12px; color:#ff4500; margin:4px 0 0 0;">※更新ボタンを押すと保存されます</p>
            `;
                photoArea.appendChild(div);
            }
        }
    });


    // 4. 既存画像の削除ボタン処理（保留処理）
    if (removeButton) {
        removeButton.addEventListener("click", function () {
            // 即座にフェッチ通信はせず、フラグの変更と画面操作だけを行う
            isImageDeletedPending = true;
            newImageFilePending = null; // もし選択中の新画像があればクリアする
            photoInput.value = ""; // インプットの選択状態もリセット

            // 画面上から画像領域を非表示にする
            const currentImageDiv = document.querySelector(".current-image");
            if (currentImageDiv) {
                currentImageDiv.style.display = "none";
            }
        });
    }


    // 5. 更新ボタン押下時の一括同期処理
    document.getElementById('update-form').addEventListener('submit', async function (e) {
        e.preventDefault();

        // A. 送信するテキストデータの組み立て
        const textFormData = {
            category_id: categorySelect.value,
            found_date: document.getElementById('found_date').value,
            found_place: document.getElementsByName('found_place')[0].value,
            description: document.getElementsByName('description')[0].value
        };

        try {
            // ① まずはテキストの更新を実行（PATCH）
            const textResponse = await fetch(`/api/admin/posts/${postId}`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify(textFormData)
            });

            const textData = await textResponse.json();

            if (!textResponse.ok) {
                alert(textData.message || "更新に失敗しました");
                return;
            }

            // ② 既存画像の削除フラグが立っている場合、削除APIを実行（DELETE）
            if (isImageDeletedPending && originalImageId) {
                const deleteResponse = await fetch(`/api/admin/posts/${postId}/images/${originalImageId}`, {
                    method: "DELETE",
                    headers: { "X-CSRFToken": csrfToken }
                });

                if (!deleteResponse.ok) {
                    alert("テキストは更新されましたが、古い画像の削除に失敗しました。");
                    return;
                }
            }

            // ③ 新しい画像ファイルが保留されている場合、追加APIを実行（POST）
            if (newImageFilePending) {
                const imageFormData = new FormData();
                imageFormData.append("image", newImageFilePending);

                const imageResponse = await fetch(`/api/admin/posts/${postId}/images`, {
                    method: 'POST',
                    headers: { "X-CSRFToken": csrfToken },
                    body: imageFormData
                });

                if (!imageResponse.ok) {
                    alert("テキストは更新されましたが、新しい画像の保存に失敗しました。");
                    return;
                }
            }

            // 全ての一括処理が正常終了したら、完了通知を出してリダイレクト
            alert("投稿内容をすべて更新しました");
            window.location.href = textData.redirect_url;

        } catch (error) {
            console.error("一括更新エラー:", error);
            alert("通信エラーが発生しました");
        }
    });
</script>
{% endblock %}

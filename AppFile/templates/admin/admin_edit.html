{% extends "base.html" %}

{% block title %}投稿編集 - Find it{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin_posts.css' )}}">
{% endblock %}

{% block content %}
<div class="admin_posts">
    <header class="post-header">
        <a href="{{ url_for('show_posts') }}" class="back-button">
            <img src="{{ url_for('static', filename='images/arrow-left.svg') }}" class="arrow-left" alt="戻る">
        </a>
        <h2 class="admin-posts-title">投稿編集</h2>
    </header>

    <main class="main-admin-posts">

        <form id="update-form" class="posts-form" enctype="multipart/form-data">
            <input type="hidden" id="csrf_token" name="csrf_token" value="{{ csrf_token()}}">
            <div>
                <label>カテゴリグループ</label>

                <select id="groupSelect" name="group_id" class="form-select" required>
                    <option value="">グループを選択してください</option>
                    {% for group in groups %}
                    <option value="{{ group.id }}" {% if group.id==post.group_id %}selected{% endif %}>
                        {{ group.name }}
                    </option>
                    {% endfor %}
                </select>

                <label>カテゴリ</label>

                <select id="categorySelect" name="category_id" class="form-select" disabled>
                    <option value="">先にグループを選択してください</option>
                </select>
            </div>

            <div>
                <label>詳細説明</label>
                <textarea id="description" placeholder="特徴などを記載" name="description">{{ post.description }}</textarea>
            </div>

            <div>
                <label for="found_date">日付</label>
                <input type="date" id="found_date" name="found_date" value="{{ post.found_date.strftime('%Y-%m-%d') }}">
            </div>

            <div>
                <label>場所</label>
                <input type="text" id="found_place" placeholder="発見場所を記載" name="found_place"
                    value="{{ post.found_place }}">
            </div>

            <div class="photo-area">
                <div class="upload-photo">写真をアップロード</div>
                <label for="photo" class="upload-button">
                    <img src="{{ url_for('static', filename='images/upload-icon.svg')}}" alt="アップロード"
                        class="upload-icon">
                </label>
                <input type="file" id="photo" name="image" accept="image/*" hidden multiple>

                <div id="preview-container">
                    {% if images %}
                    {% for image in images %}
                    <div class="current-image" style="margin-top: 0;">
                        <img src="{{ url_for('static', filename=image.image_path.replace('static/','')) }}" alt="投稿画像"
                            class="preview-image">
                        <button type="button" id="remove-photo-button" data-post-id="{{ post.id }}"
                            data-image-id="{{ image.id }}">
                            <img class="close-icon" src="{{url_for('static', filename='images/close_round.svg')}}"
                                alt="削除">
                        </button>
                    </div>
                    {% endfor %}
                    {% endif %}
                </div>
            </div>

            <div class="register-button">
                <button class="admin-posts-button" type="submit">更新</button>
            </div>
        </form>
    </main>
</div>
{% endblock %}

{% block page_js %}
<script>
    const categoriesData = {{ categories_mapping | tojson | safe }};
    const groupSelect = document.getElementById('groupSelect');
    const categorySelect = document.getElementById('categorySelect');
    const csrfToken = document.getElementById("csrf_token").value;
    const postId = "{{ post.id }}";

    // 1. カテゴリの連動プルダウン
    groupSelect.addEventListener('change', function () {
        const selectedGroupId = this.value;
        categorySelect.innerHTML = '<option value="">カテゴリを選択してください</option>';

        if (selectedGroupId !== "") {
            const matchingCategories = categoriesData[selectedGroupId];
            if (matchingCategories) {
                matchingCategories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.id;
                    option.textContent = category.name;
                    categorySelect.appendChild(option);
                });
            }
            categorySelect.disabled = false;
        } else {
            categorySelect.innerHTML = '<option value="">先にグループを選択してください</option>';
            categorySelect.disabled = true;
        }
    });

    // 初期値セット
    groupSelect.value = "{{ post.group_id }}";
    groupSelect.dispatchEvent(new Event('change'));
    categorySelect.value = "{{ post.category_id }}";

    // 2. 画像の「状態管理」変数の定義
    let isImageDeletedPending = false;
    let newImageFilesPending = [];
    let originalImageId = null;

    // 既存画像がある場合、HTMLのデータ属性から画像IDを取得しておく
    const removeButton = document.getElementById("remove-photo-button");
    if (removeButton) {
        originalImageId = removeButton.dataset.imageId;

        removeButton.addEventListener("click", function () {
            isImageDeletedPending = true;
            const currentImageDiv = this.closest(".current-image");
            if (currentImageDiv) {
                currentImageDiv.style.display = "none";
            }
        });
    }

    // 3. 写真選択時のプレビュー処理（保留処理）
    const photoInput = document.getElementById("photo");
    const photoArea = document.querySelector(".photo-area");

    photoInput.addEventListener("change", function (e) {
        const files = e.target.files;
        if (files && files.length > 0) {


            const newFiles = Array.from(files);

            newFiles.forEach(file => {
                newImageFilesPending.push(file);

                const previewUrl = URL.createObjectURL(file);
                const div = document.createElement("div");
                div.className = "current-image";
                div.style.marginTop = "0"; // 既存画像と高さを合わせる


                div.innerHTML = `
                    <img src="${previewUrl}" alt="プレビュー画像" class="preview-image">
                    <button type="button" class="remove-new-photo-button" style="background: transparent; border: none; padding: 0; cursor: pointer; position: absolute; top: -10px; right: -10px; z-index: 10;">
                        <img class="close-icon" src="{{url_for('static', filename='images/close_round.svg')}}" alt="削除">
                    </button>
                `;


                const removeBtn = div.querySelector('.remove-new-photo-button');
                removeBtn.addEventListener('click', function () {
                    // 送信待ちの配列から、この特定のファイルだけを除外する
                    newImageFilesPending = newImageFilesPending.filter(f => f !== file);
                    // 画面からプレビューを削除する
                    div.remove();
                });

                const previewContainer = document.getElementById("preview-container");
                if (previewContainer) {
                    previewContainer.appendChild(div);
                }
            });

            // 連続して同じ画像を追加・削除できるように、inputの中身をリセット
            photoInput.value = "";
        }
    });

    // 5. 更新ボタン押下時の一括同期処理
    document.getElementById('update-form').addEventListener('submit', async function (e) {
        e.preventDefault();

        // A. 送信するテキストデータの組み立て
        const textFormData = {
            category_id: categorySelect.value,
            found_date: document.getElementById('found_date').value,
            found_place: document.getElementById('found_place').value,
            description: document.getElementById('description').value
        };

        try {
            // ① まずはテキストの更新を実行（PATCH）
            const textResponse = await fetch(`/api/admin/posts/${postId}`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify(textFormData)
            });

            const textData = await textResponse.json();

            if (!textResponse.ok) {
                alert(textData.message || "更新に失敗しました");
                return;
            }

            // ② 既存画像の削除フラグが立っている場合、削除APIを実行（DELETE）
            if (isImageDeletedPending && originalImageId) {
                const deleteResponse = await fetch(`/api/admin/posts/${postId}/images/${originalImageId}`, {
                    method: "DELETE",
                    headers: { "X-CSRFToken": csrfToken }
                });

                if (!deleteResponse.ok) {
                    alert("テキストは更新されましたが、古い画像の削除に失敗しました。");
                    return;
                }
            }

            // ③ 新しい画像ファイルが保留されている場合、追加APIを実行（POST）
            if (newImageFilesPending.length > 0) {
                const imageFormData = new FormData();

                newImageFilesPending.forEach(file => {
                    imageFormData.append("image", file);
                });

                const imageResponse = await fetch(`/api/admin/posts/${postId}/images`, {
                    method: 'POST',
                    headers: { "X-CSRFToken": csrfToken },
                    body: imageFormData
                });

                if (!imageResponse.ok) {
                    alert("テキストは更新されましたが、新しい画像の保存に失敗しました。");
                    return;
                }
            }

            // 全ての一括処理が正常終了したら、完了通知を出してリダイレクト
            alert("投稿内容をすべて更新しました");
            window.location.href = textData.redirect_url;

        } catch (error) {
            console.error("一括更新エラー:", error);
            alert("通信エラーが発生しました");
        }
    });
</script>
{% endblock %}
